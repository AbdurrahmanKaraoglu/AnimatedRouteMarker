name: animated_route_marker
description: Moves a google_maps_flutter marker smoothly along a route or towards live GPS positions at a real speed, with smooth bearing, play/pause/seek and camera follow.
version: 0.1.1
homepage: https://github.com/AbdurrahmanKaraoglu/AnimatedRouteMarker
repository: https://github.com/AbdurrahmanKaraoglu/AnimatedRouteMarker
issue_tracker: https://github.com/AbdurrahmanKaraoglu/AnimatedRouteMarker/issues
topics:
  - google-maps
  - maps
  - marker
  - animation
  - tracking

environment:
  sdk: ^3.4.0
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  google_maps_flutter: ^2.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
